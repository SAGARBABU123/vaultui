# Vault UI — Bun configuration.
#
# Industry-standard distribution: ONE publication to the npm registry —
# npm / yarn / pnpm / bun consumers all resolve the same tarball (bun is
# npm-compatible by design; there is no separate "bun registry").
#
# pnpm remains the canonical package manager for this monorepo (pnpm-lock.yaml
# is the only lockfile we commit, see .gitignore). Bun here is the consumer
# verifier: CI installs/builds a scratch consumer project with `bun add` to
# prove the `bun` install path works on every release.

[install]
# postinstall/lifecycle scripts Bun is allowed to run — mirrors
# `onlyBuiltDependencies` in pnpm-workspace.yaml.
trustedDependencies = ["esbuild", "@parcel/watcher", "sharp", "unrs-resolver"]