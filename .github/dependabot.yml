version: 2
updates:
  # Keeps the SHA-pinned third-party actions current: Dependabot opens a PR
  # that bumps the commit SHA whenever a pinned action publishes a new
  # release on the same major — this is the safe companion to SHA pinning.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - ci
      - dependencies
    groups:
      github-actions:
        patterns: ["*"]

  # Root package.json + pnpm-lock.yaml. pnpm workspaces resolve all packages
  # through the root lockfile, so this covers every app and kit.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    # Majors are deliberately NOT auto-opened. They previously landed as ~10
    # surprise PRs at once (vite 5→8, storybook 8→10, typescript 5→6,
    # react-router 6→7 …), each needing manual migration work and each queuing
    # a Vercel build. We upgrade majors on purpose. Security advisories are
    # unaffected — they are handled by the separate Dependabot security-updates
    # setting, not version updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
