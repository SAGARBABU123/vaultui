name: Keepalive — Supabase + app

# Keeps the stack warm 24/7 without any manual intervention:
#   1. Pings the deployed app (frontend uptime).
#   2. Calls /api/keepalive, which performs a real Supabase DB round-trip —
#      this is what stops a free-tier Supabase project from auto-pausing
#      after 7 days of inactivity.
#
# This is a redundant safety net on top of the Vercel Cron declared in
# vercel.json (crons → /api/keepalive daily). Two independent schedulers mean
# the free-tier project can never be paused even if one is delayed.
#
# No secrets required — the endpoint and URL are public.

on:
  schedule:
    # 05:30 UTC every day
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: https://vault-ui-bice.vercel.app
    steps:
      - name: Ping frontend
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$APP_URL/")
          echo "frontend: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::frontend returned $code"; exit 1; }

      - name: Ping Supabase via /api/keepalive
        run: |
          body=$(curl -sS --max-time 30 "$APP_URL/api/keepalive")
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::keepalive failed"; exit 1; }
