name: Deploy — Storybook

# Publishes the Vault UI showroom (apps/showroom → static Storybook) to the
# Vercel project "vault-ui-storybook".
#
# Reliable path: build in CI (repo root, pnpm workspace), stage the static
# output as a Build Output API bundle (.vercel/output), then `vercel deploy
# --prebuilt` from inside apps/showroom/dist. Prebuilt deploys ignore the
# project's framework/build settings, so this can never accidentally build
# the web app (which is what the root vercel.json would otherwise do).
#
# Secrets (same ones the web deploy uses; keep under `production-storybook`
# environment for auditability, falls back to repo secrets):
#   VERCEL_TOKEN  — required
#   VERCEL_ORG_ID — required

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-storybook
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm turbo run build --filter=@vaultui/showroom

      - name: Stage prebuilt output
        run: |
          mkdir -p apps/showroom/dist/.vercel/output/static
          cd apps/showroom/dist
          for f in * .[!.]*; do
            [ "$f" = ".vercel" ] && continue
            [ -e "$f" ] && cp -r "$f" .vercel/output/static/
          done
          printf '{"version":3}' > .vercel/output/config.json

      - name: Deploy Storybook to Vercel (production)
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping Storybook deploy"
            exit 0
          fi
          # Pin the CLI major so a breaking vercel CLI release can't break deploys
          npx --yes vercel@59 deploy --prebuilt --prod --yes \
            --project vault-ui-storybook \
            --token="$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --cwd apps/showroom/dist