name: Deploy — Storybook

# Publishes the Vault UI showroom (apps/showroom → static Storybook) to the
# Vercel project "vault-ui-storybook".
#
# Reliable path: build in CI (repo root, pnpm workspace), stage the static
# output as a Build Output API bundle (.vercel/output), then `vercel deploy
# --prebuilt` from inside apps/showroom/dist. Prebuilt deploys ignore the
# project's framework/build settings, so this can never accidentally build
# the web app (which is what the root vercel.json would otherwise do).
#
# Secrets (same ones the web deploy already uses):
#   VERCEL_TOKEN   — required
#   VERCEL_ORG_ID  — required

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  storybook:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm turbo run build --filter=@vaultui/showroom

      - name: Stage prebuilt output
        run: |
          mkdir -p apps/showroom/dist/.vercel/output/static
          cd apps/showroom/dist
          for f in * .[!.]*; do
            [ "$f" = ".vercel" ] && continue
            [ -e "$f" ] && cp -r "$f" .vercel/output/static/
          done
          printf '{"version":3}' > .vercel/output/config.json

      - name: Deploy Storybook to Vercel (production)
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping Storybook deploy"
            exit 0
          fi
          npx vercel deploy --prebuilt --prod --yes \
            --project vault-ui-storybook \
            --token="$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --cwd apps/showroom/dist