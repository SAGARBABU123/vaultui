name: CI

# Best-practice hardening:
#   - Actions pinned to full commit SHAs (Dependabot bumps them on tag moves)
#   - Least-privilege GITHUB_TOKEN (contents: read only)
#   - concurrency: cancel superseded runs (saves minutes on force-push churn)
#   - timeout-minutes on every job (a hung job can't run indefinitely)
#   - persist-credentials: false — the checkout token is never left in the
#     runner's git config; no job here pushes or needs it
#
# Release model (CI/CD):
#   - GitHub Actions = CI only (lint · typecheck · build · registry · bun smoke)
#   - Vercel native Git integration = CD (PR previews + production on main)
#   - `main` is gated by branch protection requiring `verify` + `bun-consumer`
#   - This workflow holds NO deploy credentials (least privilege)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Registry is generated source (scripts/registry-build.mjs). Any drift
      # means a kit/docs change landed without regenerating registry.json —
      # fail CI instead of shipping a stale catalog.
      - name: Registry is deterministic
        run: |
          node scripts/registry-build.mjs
          git diff --exit-code -- registry.json apps/web/public/registry.json

  # Proves the bun install/build path on every push. Uses LOCAL packed
  # tarballs (not the repo-root symlinks — bun cannot resolve css subpath
  # exports through workspace symlinks) so it works pre-publish and is
  # version-bump-proof. Mirrors what publish.yml runs post-publish from npm.
  bun-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install + build (shared artifacts)
        run: |
          pnpm install --frozen-lockfile
          # @vaultui/tokens ships raw source (no build step) — only its packed
          # tarball is needed by the consumer test below, so skip building it.
          pnpm --filter @vaultui/utils build
          pnpm --filter @vaultui/ui build

      - name: Pack local tarballs
        run: |
          for p in tokens utils ui; do (cd "packages/$p" && bun pm pack); done
          ls packages/*/*.tgz

      - name: Consumer smoke test with bun (local tarballs)
        run: |
          UI_TGZ=$(ls "$GITHUB_WORKSPACE"/packages/ui/vaultui-ui-*.tgz | head -1)
          TOKENS_TGZ=$(ls "$GITHUB_WORKSPACE"/packages/tokens/vaultui-tokens-*.tgz | head -1)
          UTILS_TGZ=$(ls "$GITHUB_WORKSPACE"/packages/utils/vaultui-utils-*.tgz | head -1)
          tmp=$(mktemp -d)
          cd "$tmp"
          cat > package.json <<EOF
          {
            "name": "smoke",
            "private": true,
            "version": "0.0.0",
            "dependencies": {
              "@vaultui/ui": "file:${UI_TGZ}",
              "@vaultui/tokens": "file:${TOKENS_TGZ}",
              "@vaultui/utils": "file:${UTILS_TGZ}",
              "react": "^18.3.1",
              "react-dom": "^18.3.1"
            }
          }
          EOF
          cat > index.tsx <<'EOF2'
          import { Button } from "@vaultui/ui";
          import "@vaultui/ui/button.css";
          import "@vaultui/tokens/tokens.css";
          const el = <Button variant="primary">Hello</Button>;
          console.log(el.type, "OK");
          EOF2
          bun install
          bun build ./index.tsx --outdir out
          node -e "require('fs').accessSync('out/index.js')" && echo "bun consumer smoke test passed ✅"