name: Dependency Review

# Blocks PRs that introduce vulnerable or malicious dependencies.
# Runs against the dependency diff of every PR; no secrets involved, and the
# token only gets `pull-requests: write` to post the summary comment on the
# PR that triggered it.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dep-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # High-severity vulnerable or malicious packages fail the check
          fail-on-severity: high