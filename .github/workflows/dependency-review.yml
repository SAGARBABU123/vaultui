name: Dependency Review

# Blocks PRs that introduce vulnerable or malicious dependencies.
# Runs against the dependency diff of every PR; no secrets involved, and the
# token only gets `pull-requests: write` to post the summary comment on the
# PR that triggered it.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dep-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # High-severity vulnerable or malicious packages fail the check
          fail-on-severity: high