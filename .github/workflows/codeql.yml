name: CodeQL

# GitHub's semantic code scanning for the JavaScript/TypeScript surface.
# Results appear under GitHub → Security → Code scanning.
# `build-mode: none` covers interpreted JS/TS without needing a pnpm build,
# so it can't be held hostage by Webpack/Vite toolchain churn.
#
# Permissions are the exact minimum CodeQL needs:
#   contents: read (checkout) · security-events: write (upload results) ·
#   actions: read (view the workflow to build a SARIF model)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"