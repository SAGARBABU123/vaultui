name: Deploy — Supabase

# Auto-push database migrations to the linked Supabase project whenever
# migrations change on main. Add secrets first:
#   SUPABASE_ACCESS_TOKEN  — Supabase dashboard → Account → Access tokens
#   SUPABASE_PROJECT_ID    — the project ref (Superbase dashboard → project URL slug)
#   SUPABASE_DB_PASSWORD   — the database password (used by `db push`)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  db-push:
    runs-on: ubuntu-latest
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_ID != '' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push migrations
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"