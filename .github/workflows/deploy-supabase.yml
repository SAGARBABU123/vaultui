name: Deploy — Supabase

# Auto-apply database migrations whenever they change on main.
# Uses the Supabase Management API (access token only — no DB password).
# A `vault_migrations_applied` tracking table makes re-runs safe/idempotent.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  db-push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations (Management API)
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query"
          q() { curl -fsS -X POST \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "$(python3 -c 'import json,sys; print(json.dumps({"query": sys.stdin.read()}))' <<<"$1")" \
                  "$API"; }

          # Migration tracker (idempotency across repeated pushes)
          q "create table if not exists vault_migrations_applied (name text primary key);" >/dev/null

          for f in supabase/migrations/*.sql; do
            name="$(basename "$f")"
            if q "select 1 from vault_migrations_applied where name = '${name}';" | grep -q '"1"'; then
              echo "skip  ${name} (already applied)"
              continue
            fi
            echo "apply ${name}"
            q "$(cat "$f")" >/dev/null
            q "insert into vault_migrations_applied (name) values ('${name}') on conflict do nothing;" >/dev/null
          done
          echo "Supabase migrations up to date."