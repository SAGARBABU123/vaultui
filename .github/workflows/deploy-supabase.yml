name: Deploy — Supabase

# Auto-apply database migrations whenever they change on main.
# Uses the Supabase Management API (access token only — no DB password).
# A `vault_migrations_applied` tracking table makes re-runs safe/idempotent.
#
# Secrets (keep under the `supabase` environment for auditability, falls
# back to repo secrets):
#   SUPABASE_ACCESS_TOKEN — dashboard → Account → Access tokens
#   SUPABASE_PROJECT_ID  — the <ref> in https://<ref>.supabase.co
#
# Hardening note: this workflow executes arbitrary SQL from repo files via
# the Management API, so the guard below is a hard fail (not a warning) if
# the token is unset — it must never run with an empty Authorization header.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Apply migrations (Management API)
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN is not set — refusing to run}"

          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query"
          q() { curl -fsS -X POST \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "$(python3 -c 'import json,sys; print(json.dumps({"query": sys.stdin.read()}))' <<<"$1")" \
                  "$API"; }

          # Migration tracker (idempotency across repeated pushes)
          q "create table if not exists vault_migrations_applied (name text primary key);" >/dev/null

          for f in supabase/migrations/*.sql; do
            name="$(basename "$f")"
            if q "select name from vault_migrations_applied where name = '${name}';" | grep -q '"name"'; then
              echo "skip  ${name} (already applied)"
              continue
            fi
            echo "apply ${name}"
            q "$(cat "$f")" >/dev/null
            q "insert into vault_migrations_applied (name) values ('${name}') on conflict do nothing;" >/dev/null
          done
          echo "Supabase migrations up to date."